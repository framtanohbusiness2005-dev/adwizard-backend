<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdWizard CI — Agent IA Publicitaire</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F5A623; --gold-light: #FFD07A;
    --dark: #0D0D0D; --dark-2: #161616; --dark-3: #1F1F1F; --dark-4: #2A2A2A;
    --text: #E8E0D5; --muted: #8A8070; --accent: #FF6B35; --green: #2ECC71;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--dark); font-family:'DM Sans',sans-serif; color:var(--text);
    height:100vh; display:flex; flex-direction:column; align-items:center; overflow:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245,166,35,0.12) 0%, transparent 60%);
  }
  .header {
    width:100%; max-width:700px; padding:18px 24px 0;
    display:flex; align-items:center; justify-content:space-between; z-index:10; flex-shrink:0;
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon {
    width:40px; height:40px; border-radius:11px;
    background:linear-gradient(135deg,var(--gold),var(--accent));
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow:0 4px 16px rgba(245,166,35,0.3);
  }
  .logo-text { font-family:'Syne',sans-serif; font-weight:800; font-size:19px; }
  .logo-text span { color:var(--gold); }
  .badge {
    display:flex; align-items:center; gap:6px;
    background:var(--dark-3); border:1px solid var(--dark-4);
    border-radius:20px; padding:5px 13px; font-size:12px; color:var(--muted);
  }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .chat-wrapper {
    width:100%; max-width:700px; flex:1; display:flex; flex-direction:column;
    padding:14px 24px 0; z-index:10; overflow:hidden; min-height:0;
  }
  .messages {
    flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:13px;
    padding-bottom:8px; scrollbar-width:thin; scrollbar-color:var(--dark-4) transparent;
  }
  .messages::-webkit-scrollbar { width:3px; }
  .messages::-webkit-scrollbar-thumb { background:var(--dark-4); border-radius:3px; }

  .msg { display:flex; gap:10px; animation:pop .35s cubic-bezier(.16,1,.3,1) forwards; opacity:0; }
  .msg.user { flex-direction:row-reverse; }
  @keyframes pop { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .av {
    width:33px; height:33px; border-radius:9px; flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .av.bot { background:linear-gradient(135deg,var(--gold),var(--accent)); box-shadow:0 2px 10px rgba(245,166,35,.25); }
  .av.usr { background:var(--dark-3); border:1px solid var(--dark-4); font-size:12px; font-weight:700; color:var(--gold); }

  .bubble {
    max-width:calc(100% - 50px); padding:11px 15px;
    border-radius:16px; line-height:1.6; font-size:14px;
  }
  .bubble.bot { background:var(--dark-2); border:1px solid var(--dark-3); border-bottom-left-radius:3px; }
  .bubble.user { background:linear-gradient(135deg,var(--gold),#E8950F); border-bottom-right-radius:3px; color:var(--dark); font-weight:500; }

  .card {
    background:var(--dark-3); border:1px solid var(--dark-4);
    border-radius:11px; padding:13px 15px; margin-top:9px;
  }
  .card-title { font-family:'Syne',sans-serif; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin-bottom:8px; }
  .copy-btn {
    background:none; border:1px solid var(--dark-4); color:var(--muted);
    padding:4px 11px; border-radius:6px; font-size:11px; cursor:pointer;
    margin-top:8px; font-family:'DM Sans',sans-serif; transition:all .2s;
  }
  .copy-btn:hover { border-color:var(--gold); color:var(--gold); }

  .typing { display:flex; gap:10px; animation:pop .3s ease forwards; }
  .typing-dots {
    background:var(--dark-2); border:1px solid var(--dark-3);
    border-radius:16px; border-bottom-left-radius:3px;
    padding:13px 16px; display:flex; gap:4px; align-items:center;
  }
  .d { width:5px; height:5px; border-radius:50%; background:var(--muted); animation:b 1.2s infinite; }
  .d:nth-child(2){animation-delay:.2s} .d:nth-child(3){animation-delay:.4s}
  @keyframes b { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-5px);opacity:1} }

  .choices { display:flex; flex-wrap:wrap; gap:7px; padding:7px 0 3px 43px; }
  .cbtn {
    background:var(--dark-3); border:1px solid var(--dark-4); color:var(--text);
    padding:7px 14px; border-radius:18px; font-size:13px; cursor:pointer;
    transition:all .2s; font-family:'DM Sans',sans-serif;
  }
  .cbtn:hover { background:rgba(245,166,35,.1); border-color:var(--gold); color:var(--gold); transform:translateY(-1px); }
  .cbtn:disabled { opacity:.3; cursor:not-allowed; transform:none; }

  .prog { display:flex; gap:4px; padding:9px 0 7px 43px; flex-shrink:0; }
  .ps { height:3px; flex:1; background:var(--dark-4); border-radius:2px; transition:background .4s; }
  .ps.done { background:var(--gold); }
  .ps.active { background:linear-gradient(90deg,var(--gold),var(--gold-light)); }

  .input-area { padding:10px 0 18px; display:flex; gap:9px; align-items:center; flex-shrink:0; }
  .iw {
    flex:1; background:var(--dark-2); border:1px solid var(--dark-4);
    border-radius:13px; display:flex; align-items:center; padding:3px 3px 3px 15px;
    transition:border-color .2s;
  }
  .iw:focus-within { border-color:var(--gold); box-shadow:0 0 0 3px rgba(245,166,35,.08); }
  .iw input {
    flex:1; background:none; border:none; outline:none; color:var(--text);
    font-size:14px; font-family:'DM Sans',sans-serif; padding:9px 0;
  }
  .iw input::placeholder { color:var(--muted); }
  .sbtn {
    width:40px; height:40px; background:linear-gradient(135deg,var(--gold),var(--accent));
    border:none; border-radius:11px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 12px rgba(245,166,35,.3); transition:all .2s; flex-shrink:0;
  }
  .sbtn:hover { transform:scale(1.05); }
  .sbtn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .sbtn svg { width:16px; height:16px; fill:white; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🎯</div>
    <div class="logo-text">Ad<span>Wizard</span></div>
  </div>
  <div class="badge"><div class="dot"></div>Agent actif</div>
</div>

<div class="chat-wrapper">
  <div class="messages" id="msgs"></div>
  <div id="progArea"></div>
  <div id="choiceArea"></div>
  <div class="input-area">
    <div class="iw">
      <input type="text" id="inp" placeholder="Écris ta réponse ici..." autocomplete="off"
        onkeydown="if(event.key==='Enter')send()">
    </div>
    <button class="sbtn" id="sbtn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const API = '/api/chat';
let history = [], userName = '', step = 0, busy = false;
const STEPS = 6;

window.onload = () => call('Bonjour, je veux créer une campagne publicitaire.');

function addMsg(role, text) {
  const box = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const initial = role === 'bot' ? '🎯' : (userName ? userName[0].toUpperCase() : '👤');
  d.innerHTML = `
    <div class="av ${role === 'bot' ? 'bot' : 'usr'}">${initial}</div>
    <div class="bubble ${role === 'bot' ? 'bot' : 'user'}">${fmt(text)}</div>`;
  box.appendChild(d);
  if (role === 'bot') {
    const ch = getChoices(text);
    if (ch.length >= 2) renderChoices(ch);
  }
  updateProg();
  scroll();
}

function fmt(t) {
  t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  // Wrap campaign sections in cards
  ['OBJECTIF META', 'TEXTE PUBLICITAIRE', 'CIBLAGE META', 'BUDGET'].forEach(s => {
    const re = new RegExp(`(<strong>[^<]*${s}[^<]*<\\/strong>(?:<br>|.)*?)(?=<strong>[^<]*(OBJECTIF|TEXTE|CIBLAGE|BUDGET)|$)`, 'i');
    t = t.replace(re, m => {
      const copy = s === 'TEXTE' ? `<button class="copy-btn" onclick="cp(this)">📋 Copier</button>` : '';
      return `<div class="card"><div class="card-title">${s}</div><div style="font-size:13px;line-height:1.6">${m}</div>${copy}</div>`;
    });
  });
  return t;
}

function cp(btn) {
  const txt = btn.previousElementSibling.innerText;
  navigator.clipboard.writeText(txt).then(() => { btn.textContent='✅ Copié !'; setTimeout(()=>btn.textContent='📋 Copier',2000); });
}

function getChoices(t) {
  const m = t.match(/[A-G]\.\s[^\n]+/g);
  return m && m.length >= 2 ? m.slice(0,7) : [];
}

function renderChoices(list) {
  const a = document.getElementById('choiceArea');
  a.innerHTML = '';
  const w = document.createElement('div');
  w.className = 'choices';
  list.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cbtn'; b.textContent = c;
    b.onclick = () => { clearChoices(); userMsg(c); };
    w.appendChild(b);
  });
  a.appendChild(w);
  scroll();
}

function clearChoices() {
  document.querySelectorAll('.cbtn').forEach(b => b.disabled = true);
  setTimeout(() => document.getElementById('choiceArea').innerHTML = '', 300);
}

function updateProg() {
  const n = history.length;
  if (n <= 3) step = 0; else if (n <= 9) step = 1;
  else if (n <= 13) step = 2; else if (n <= 15) step = 3;
  else if (n <= 19) step = 4; else step = 5;
  const labels = ['Accueil','Business','Business','Budget','Campagne','Suivi'];
  let h = '<div class="prog">';
  for (let i = 0; i < STEPS; i++) {
    const c = i < step ? 'done' : i === step ? 'active' : '';
    h += `<div class="ps ${c}" title="${labels[i]||''}"></div>`;
  }
  document.getElementById('progArea').innerHTML = h + '</div>';
}

function showTyping() {
  const b = document.getElementById('msgs');
  const t = document.createElement('div');
  t.className = 'typing'; t.id = 'typ';
  t.innerHTML = `<div class="av bot">🎯</div><div class="typing-dots"><div class="d"></div><div class="d"></div><div class="d"></div></div>`;
  b.appendChild(t); scroll();
}
function hideTyping() { const t = document.getElementById('typ'); if(t) t.remove(); }
function scroll() { const m = document.getElementById('msgs'); setTimeout(() => m.scrollTop = m.scrollHeight, 50); }

function send() {
  const i = document.getElementById('inp');
  const t = i.value.trim();
  if (!t || busy) return;
  i.value = '';
  clearChoices();
  userMsg(t);
}

function userMsg(t) {
  if (t.length < 20 && history.length <= 3 && !t.includes(' ')) userName = t;
  addMsg('user', t);
  history.push({ role: 'user', content: t });
  call(null);
}

async function call(init) {
  if (busy) return;
  busy = true;
  document.getElementById('inp').disabled = true;
  document.getElementById('sbtn').disabled = true;
  if (init) history.push({ role: 'user', content: init });
  showTyping();
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const d = await r.json();
    hideTyping();
    if (d.error) { addMsg('bot', '⚠️ Erreur : ' + d.error); }
    else { history.push({ role: 'assistant', content: d.reply }); addMsg('bot', d.reply); }
  } catch(e) {
    hideTyping();
    addMsg('bot', '⚠️ Erreur de connexion. Réessaie dans un instant.');
  }
  busy = false;
  document.getElementById('inp').disabled = false;
  document.getElementById('sbtn').disabled = false;
  document.getElementById('inp').focus();
}
</script>
</body>
</html>
